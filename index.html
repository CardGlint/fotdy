<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f2" />
    <title>fitfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="wordmark" href="#" aria-label="Fitfolio home">fitfolio</a>
        <div class="top-actions">
          <button class="quiet-button" id="clearButton" type="button" disabled>Clear</button>
          <button class="save-button" id="saveButton" type="button" disabled>Save image</button>
        </div>
      </header>

      <section class="work-area" aria-label="Outfit canvas">
        <div class="canvas" id="canvas" role="application" aria-label="Outfit canvas. Add photos and drag them to arrange.">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon" aria-hidden="true"><span></span><span></span><span></span></div>
            <p>Your canvas is empty</p>
            <small>Add a clothing photo to get started</small>
          </div>
          <div class="pieces" id="pieces"></div>
          <div class="canvas-count" id="canvasCount" aria-live="polite"></div>
        </div>
      </section>

      <footer class="bottom-bar">
        <button class="add-button" id="addButton" type="button"><span class="add-plus" aria-hidden="true">＋</span><span>Add element</span></button>
      </footer>
    </main>

    <input id="photoInput" type="file" accept="image/*" hidden />
    <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
    <div class="processing" id="processing" role="status" aria-live="polite" hidden><div class="spinner"></div><span>Removing background…</span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="sheet" id="addSheet" aria-labelledby="sheetTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head"><div><h1 id="sheetTitle">Add an element</h1><p>Choose a photo of one clothing item.</p></div><button class="close-button" id="closeSheet" type="button" aria-label="Close">×</button></div>
      <button class="sheet-option" id="takePhoto" type="button"><span class="option-icon camera-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.4-2h7.2l1.4 2h3v10H4z"/><circle cx="12" cy="13.5" r="3.2"/></svg></span><span><strong>Take a photo</strong><small>Use your camera</small></span><span class="option-arrow" aria-hidden="true">›</span></button>
      <button class="sheet-option" id="choosePhoto" type="button"><span class="option-icon photo-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="15" rx="2"/><circle cx="9" cy="9.5" r="1.3"/><path d="m5.5 17 4.3-4.2 2.8 2.5 2.2-2 3.7 3.7"/></svg></span><span><strong>Choose from photos</strong><small>Select an image on your phone</small></span><span class="option-arrow" aria-hidden="true">›</span></button>
      <p class="sheet-note">A plain background gives the cleanest cutout.</p>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
